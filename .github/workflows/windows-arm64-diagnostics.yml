name: Windows ARM64 conformance diagnostics

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Release run whose stable-package-windows-arm64 artifact should be diagnosed
        required: true
        type: string
  push:
    branches: [release/1.9.0-final]
    paths:
      - .github/workflows/windows-arm64-diagnostics.yml
      - scripts/conformance/conpty_smoke.py
      - scripts/conformance/explicit_command_boot.py

permissions:
  contents: read
  actions: read

env:
  # Dispatch is only available once the workflow exists on the default branch;
  # branch pushes diagnose the latest ARM64 package produced by the release run.
  PACKAGE_RUN: ${{ inputs.package_run || '35687864774' }}

jobs:
  diagnose:
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      NEBULA_RESIZE_TRACE: "1"
      NEBULA_BOOT_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: stable-package-windows-arm64
          run-id: ${{ env.PACKAGE_RUN }}
          github-token: ${{ github.token }}
          path: diagnostic-package
      - name: Extract the portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem diagnostic-package -Filter *.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath diagnostic-runtime -Force
          Get-ChildItem -Recurse diagnostic-runtime | Select-Object FullName, Length
      - name: Describe the host
        shell: pwsh
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          whoami /groups | Select-String -Pattern 'Mandatory|Administrators'
          foreach ($name in 'pwsh', 'powershell', 'cmd', 'python') {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if ($null -eq $command) { "${name}: not found"; continue }
            $bytes = [IO.File]::ReadAllBytes($command.Source)
            $offset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            "{0}: {1} machine={2:x4}" -f $name, $command.Source, $machine
          }
          python -c "import platform, sys; print(sys.version, platform.machine())"
      - name: Explicit -e commands through the application
        if: always()
        shell: pwsh
        run: python scripts/conformance/windows_standard_user.py scripts/conformance/explicit_command_boot.py diagnostic-runtime/pebrel.exe diagnostic-output/explicit-commands.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-conformance-diagnostics
          path: diagnostic-output
          if-no-files-found: warn
          retention-days: 7
